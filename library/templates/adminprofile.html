<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Item</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

<style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background:
        url('https://images.squarespace-cdn.com/content/v1/534ad50ae4b04a5110f5ae72/f0cd330d-46de-4f2e-864a-31e2741cf6ae/Salle+Ovale,%2CBNF+Richelieu,%2CHenri+Labrouste,%2C1936.jpg')
        no-repeat center center/cover;
      backdrop-filter: blur(6px);
    }

    .view-card {
      width: 75%;
      max-width: 950px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.8s ease-out;
      backdrop-filter: blur(20px);
      transform: translateY(0);
      transition: 0.4s ease;
    }

    .view-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 55px rgba(0, 0, 0, 0.75);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(25px);}
      to { opacity: 1; transform: translateY(0);}
    }

    .img-col {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      padding: 25px;
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(255,255,255,0.25);
    }

    .img-col img {
      width: 75%;
      height: auto;
      border-radius: 14px;
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.45);
      transition: 0.3s ease;
    }

    .img-col img:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 45px rgba(0, 0, 0, 0.6);
    }

    .card-body {
      padding: 45px 35px;
      color: #fff;
    }

    .card-title {
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 18px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
      letter-spacing: 1px;
    }

    .card-text {
      margin-bottom: 12px;
      font-size: 1.1rem;
      font-weight: 400;
      opacity: 0.9;
    }

    .card-text strong {
      font-weight: 600;
      color: #ffe8e8;
    }

    /* Button Styling */
    .btn-outline-light {
      padding: 12px 28px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 10px;
      border: 2px solid #fff;
      transition: 0.35s ease;
      letter-spacing: 0.5px;
      box-shadow: 0px 0px 8px rgba(255,255,255,0.3);
    }

    .btn-outline-light:hover {
      background-color: #fff;
      color: #0d1958;
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0px 0px 15px rgba(255,255,255,0.6);
    }

    .actions {
      margin-top: 35px;
      display: flex;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .view-card {
        width: 95%;
      }
      .img-col img {
        width: 85%;
      }
      .card-body {
        padding: 25px 20px;
      }
      .card-title {
        font-size: 1.6rem;
      }
    }
</style>


</head>

<body>
  <div class="view-card">
    <div class="row g-0">
      <div class="col-md-5 img-col">
       {% if profile[1] %}
    <img src="{{ url_for('static', filename='uploads/' ~ profile[1]) }}" />
{% else %}
    <img src="{{ url_for('static', filename='uploads/default.png') }}" />
{% endif %}

      </div>
      <div class="col-md-7">
        <div class="card-body">
          <h5 class="card-title">adminName:{{profile[0]}}</h5>
          <p class="card-text"><strong>Email:</strong> {{profile[2]}}</p>
          <p class="card-text"><strong>phone_no:</strong>{{profile[3]}}</p>         

          <div class="actions">
            <a href="{{ url_for('adminprofileupdate') }}" class="btn btn-outline-light">Edit</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>
</html>
