<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Library | AdminLogin</title>

  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://images.squarespace-cdn.com/content/v1/534ad50ae4b04a5110f5ae72/f0cd330d-46de-4f2e-864a-31e2741cf6ae/Salle+Ovale%2C+BNF+Richelieu%2C+Henri+Labrouste%2C+1936.jpg') no-repeat center center/cover;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      margin: 0;
    }

    .login-box {
      width: 350px;
      background:  rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      padding: 40px 30px;
      text-align: center;
      transition: all 0.4s ease;
    }

    .login-box:hover {
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.6);
      transform: scale(1.02);
    }

    .login-box img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    h2 {
      color: #fff;
      margin-bottom: 25px;
      font-size: 26px;
    }

    .input-box {
      position: relative;
      margin-bottom: 20px;
      width: 100%;
    }

    .input-box input {
      width: 100%;
      padding: 10px 12px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.4);
      color: white;
      border-radius: 6px;
      font-size: 15px;
    }

    .input-box input::placeholder {
      color: #ddd;
    }

    .btn-login {
      width: 100%;
      padding: 10px;
      border: none;
      background: linear-gradient(90deg, #007bff, #00c6ff);
      color: white;
      font-weight: bold;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-login:hover {
      box-shadow: 0 0 15px rgba(0, 128, 255, 0.6);
      transform: translateY(-2px);
    }

    .links {
      margin-top: 15px;
      font-size: 14px;
    }

    .links a {
      color: white;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 13px;
    }
  </style>

</head>

<body>

  <div class="login-box">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXcZvD3S0MY-KWUOKSTmhkpZyPkf-z04kBFQ&s" alt="Library Logo">
    <h2>AdminLogin</h2>

    <form action="#" method="post">
      <div class="input-box">
        <input type="email" name="email" placeholder="Enter email" required>
      </div>
      <div class="input-box">
        <input type="password"  name="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="links">
      <p>Don't have an account? <a href="{{url_for('adminregister')}}">Register</a></p>
      <p><a href=#>Forgot Password?</a></p>
    </div>
     
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div style="display: flex; justify-content: center; align-items: center; flex-direction: column; margin-top: 20px;">
      {% for message in messages %}
        <div style = "color: #ddd;">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
  </div>

  <footer>
    © 2025 E-Library Management System
  </footer>

</body>
</html>
