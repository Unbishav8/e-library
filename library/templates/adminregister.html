<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Library | Admin Sign Up</title>

  <style>
    /* --- Base Page Styling --- */
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://images.squarespace-cdn.com/content/v1/534ad50ae4b04a5110f5ae72/f0cd330d-46de-4f2e-864a-31e2741cf6ae/Salle+Ovale%2C+BNF+Richelieu%2C+Henri+Labrouste%2C+1936.jpg') 
        no-repeat center center/cover;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      margin: 0;
    }

    /* --- Sign Up Box --- */
    .signup-box {
      width: 370px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      padding: 35px 30px;
      text-align: center;
      transition: all 0.4s ease;
    }

    .signup-box:hover {
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.6);
      transform: scale(1.02);
    }

    .signup-box img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 12px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    h2 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 24px;
    }

    /* --- Form Styling --- */
    form {
      text-align: left;
    }

    .form-label {
      display: block;
      color: #fff;
      font-weight: 500;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 6px;
      font-size: 15px;
      transition: all 0.3s ease;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    .form-control::placeholder {
      color: #ddd;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 10px #00aaff;
    }

    .form-check {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-check-label {
      color: #fff;
      font-size: 13px;
    }

    /* --- Button Styling --- */
    .btn-submit {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
      transform: translateY(-2px);
    }

    /* --- Extra Links --- */
    .extra-links {
      margin-top: 15px;
      font-size: 13px;
      color: #eee;
      text-align: center;
    }

    .extra-links a {
      color: #ffeb3b;
      text-decoration: none;
      font-weight: 500;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    .alert {
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      background: rgba(255, 87, 87, 0.8);
      color: white;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="signup-box">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXcZvD3S0MY-KWUOKSTmhkpZyPkf-z04kBFQ&s" alt="Admin Logo" />
    <h2>Admin Sign Up</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <label class="form-label">Admin Name</label>
      <input type="text" class="form-control" name="username" placeholder="Enter admin name" required />

      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" placeholder="Enter admin email" required />

      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" placeholder="Create a password" required />

      <div class="form-check">
        <input type="checkbox" name="agree" id="agree" required />
        <label for="agree" class="form-check-label">I agree to the terms & conditions</label>
      </div>

      <button type="submit" class="btn-submit">Register as Admin</button>
    </form>

    <div class="extra-links">
      Already registered? <a href="{{ url_for('adminlogin') }}">Admin Login</a>
    </div>
  </div>

</body>
</html>
