<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Library | Sign Up</title>

  <style>
    /* --- Base Page Styling --- */
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://images.squarespace-cdn.com/content/v1/534ad50ae4b04a5110f5ae72/f0cd330d-46de-4f2e-864a-31e2741cf6ae/Salle+Ovale%2C+BNF+Richelieu%2C+Henri+Labrouste%2C+1936.jpg') 
        no-repeat center center/cover;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      margin: 0;
    }

    /* --- Sign Up Box --- */
    .signup-box {
      width: 370px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      padding: 40px 30px;
      text-align: center;
      transition: all 0.4s ease;
    }

    .signup-box:hover {
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.6);
      transform: scale(1.02);
    }

    .signup-box img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 15px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    h2 {
      color: #fff;
      margin-bottom: 25px;
      font-size: 26px;
    }

    /* --- Form Styling --- */
    form {
      text-align: left;
    }

    .form-label {
      display: block;
      color: #fff;
      font-weight: 500;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 6px;
      font-size: 15px;
      transition: all 0.3s ease;
      margin-bottom: 15px;
    }

    .form-control::placeholder {
      color: #ddd;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 5px #00c6ff;
    }

    .form-check {
      display: flex;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .form-check-input {
      margin-right: 8px;
      accent-color: #00bfff;
    }

    .form-check-label {
      color: #fff;
      font-size: 14px;
    }

    /* --- Button --- */
    .btn-signup {
      width: 100%;
      padding: 10px;
      border: none;
      background: linear-gradient(90deg, #007bff, #00c6ff);
      color: white;
      font-weight: bold;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-signup:hover {
      box-shadow: 0 0 15px rgba(0, 128, 255, 0.6);
      transform: translateY(-2px);
    }

    /* --- Links --- */
    .links {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .links a {
      color: white;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    /* --- Footer --- */
    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 13px;
    }

  </style>
</head>

<body>

  <div class="signup-box">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXcZvD3S0MY-KWUOKSTmhkpZyPkf-z04kBFQ&s" alt="Library Logo">
    <h2>Create an Account</h2>

    <form action="#" method="post">

      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" name="username" placeholder="Enter your name" required>

      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>

      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
      <div class="form-check">
        <input type="checkbox" class="form-check-input" id="agree" name="agree" required>
        <label class="form-check-label" for="agree">I agree to the terms</label>
      </div>

      <button type="submit" class="btn-signup">Sign Up</button>
    </form>

    <div class="links">
      <p>Already have an account? <a href="{{url_for('userlogin')}}">Login</a></p>
    </div>
  </div>

  

</body>
</html>
